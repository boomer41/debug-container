# .github/dependabot.yml
version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    reviewers:
      - "boomer41"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Berlin"
    reviewers:
      - "boomer41"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
